<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товаров</title>
    <style>
        * {
            box-sizing:border-box;
        }
        body {
            margin: 0;
            color: white;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: 18px;
            line-height: 1.5;
            background: linear-gradient(#f0554d, #6e2622);
            min-height: 100vh; 
            background-attachment: fixed; 
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 24px;
            background: transparent; 
        }
        h1 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 36px;
            line-height: 1.2;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .products li {
            width: 220px;
            max-width: 100%;
            padding: 16px;
            border:1px solid white;
            border-radius: 12px;
            background-color: rgb(98, 13, 13);
            overflow-wrap: anywhere;
        }
        .products-name {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .product-price {
            color: #c34841;
        }
        
    </style>
</head>
<body>
    <main>
        <h1>Каталог товаров</h1>
        {% if products %}
        <form class="budget-form">
            <label for="max-price"></label>
        </form>
        <ul class="products">
           {% for product in products %}
           <li>
                <span class="products-name">{{ product.name }}</span>
                <span class="product-price">{{ product.price}}</span>
           </li>
           {% endfor %}

           {% else %}
                <p>По этой цене нет товаров</p>
           {% endif %}
        </ul>
    </main>
</body>
</html>
